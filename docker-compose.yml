version: '3.8'

# 摔倒检测系统 - Docker Compose 配置
# 使用方式：docker-compose up -d

services:
  # 主应用服务
  fall-detection:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fall-detection-system
    restart: unless-stopped
    
    # 端口映射
    ports:
      - "8501:8501"
    
    # 环境变量
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - LOG_LEVEL=INFO
      - DETECTION_HEIGHT_THRESHOLD=0.3
      - DETECTION_VELOCITY_THRESHOLD=0.5
      - DETECTION_CONFIRMATION_FRAMES=2
    
    # 数据卷挂载
    volumes:
      # 应用代码（开发模式，可热更新）
      - ./app.py:/app/app.py:ro
      - ./src:/app/src:ro
      - ./requirements.txt:/app/requirements.txt:ro
      
      # 持久化数据
      - ./datasets:/app/datasets
      - ./logs:/app/logs
      - ./configs:/app/configs
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 网络配置
    networks:
      - fall-detection-network
    
    # 依赖服务
    depends_on:
      - redis
  
  # Redis 缓存（用于会话管理）
  redis:
    image: redis:7-alpine
    container_name: fall-detection-redis
    restart: unless-stopped
    
    # 数据持久化
    volumes:
      - redis-data:/data
    
    # 网络隔离
    networks:
      - fall-detection-network
    
    # 健康检查
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Nginx 反向代理（可选，用于生产环境）
  nginx:
    image: nginx:alpine
    container_name: fall-detection-nginx
    restart: unless-stopped
    
    # 端口映射
    ports:
      - "80:80"
      - "443:443"
    
    # 配置文件
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    
    # 依赖主应用
    depends_on:
      - fall-detection
    
    # 网络配置
    networks:
      - fall-detection-network
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 仅在需要时启用（默认注释掉）
    # profiles:
    #   - production

# 数据卷
volumes:
  redis-data:
    driver: local

# 网络
networks:
  fall-detection-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
