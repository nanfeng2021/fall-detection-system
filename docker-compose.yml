version: '3.8'

# 摔倒检测系统 - Docker Compose 配置
# 使用方式：docker-compose up -d

services:
  # Web界面服务 (Streamlit)
  web-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fall-detection-web
    restart: unless-stopped
    
    # 端口映射
    ports:
      - "8501:8501"
    
    # 环境变量
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - LOG_LEVEL=INFO
      - API_BASE_URL=http://api:8000
    
    # 数据卷挂载
    volumes:
      # 应用代码（开发模式，可热更新）
      - ./app.py:/app/app.py:ro
      - ./src:/app/src:ro
      - ./config.yaml:/app/config.yaml:ro
      
      # 持久化数据
      - ./datasets:/app/datasets
      - ./logs:/app/logs
      - ./data:/app/data
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 网络配置
    networks:
      - fall-detection-network
    
    # 依赖服务
    depends_on:
      - api
      - redis

  # API服务 (FastAPI)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fall-detection-api
    restart: unless-stopped
    
    # 端口映射
    ports:
      - "8000:8000"
    
    # 环境变量
    environment:
      - LOG_LEVEL=INFO
      - DETECTION_HEIGHT_THRESHOLD=0.3
      - DETECTION_VELOCITY_THRESHOLD=0.5
      - DETECTION_CONFIRMATION_FRAMES=2
      - REDIS_URL=redis://redis:6379
    
    # 数据卷挂载
    volumes:
      - ./src:/app/src:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./datasets:/app/datasets
      - ./logs:/app/logs
      - ./data:/app/data
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 网络配置
    networks:
      - fall-detection-network
    
    # 依赖服务
    depends_on:
      - redis
  
  # Redis 缓存（用于会话管理）
  redis:
    image: redis:7-alpine
    container_name: fall-detection-redis
    restart: unless-stopped
    
    # 数据持久化
    volumes:
      - redis-data:/data
    
    # 网络隔离
    networks:
      - fall-detection-network
    
    # 健康检查
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Nginx 反向代理（可选，用于生产环境）
  nginx:
    image: nginx:alpine
    container_name: fall-detection-nginx
    restart: unless-stopped
    
    # 端口映射
    ports:
      - "80:80"
      - "443:443"
    
    # 配置文件
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    
    # 依赖主应用
    depends_on:
      - fall-detection
    
    # 网络配置
    networks:
      - fall-detection-network
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 仅在需要时启用（默认注释掉）
    # profiles:
    #   - production

# 数据卷
volumes:
  redis-data:
    driver: local

# 网络
networks:
  fall-detection-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
